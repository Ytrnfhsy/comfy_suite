[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-suite"
version = "0.1.0"
description = "Generative AI (ComfyUI) companion panel for the PhotoSuite image editor"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "Pillow>=10",
    "websocket-client>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
comfy-suite = "comfy_suite.cli:main"

[tool.setuptools.packages.find]
include = ["comfy_suite*"]

[tool.setuptools.package-data]
comfy_suite = ["styles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
